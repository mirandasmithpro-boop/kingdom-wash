<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kingdom Wash - 10% off your first service</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f2ec;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e5e2d8;
    border-radius: 16px;
    padding: 3rem 3.5rem;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    max-width: 420px;
  }
  .badge {
    display: inline-block;
    background: #fdeee0;
    color: #a4560b;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    margin-bottom: 1.25rem;
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: 2.1rem;
    margin: 0 0 0.75rem;
    color: #211f1a;
  }
  p {
    color: #5f5d57;
    font-size: 1.05rem;
    margin: 0 0 2rem;
  }
  button {
    background: #211f1a;
    color: #fff;
    border: none;
    padding: 0.85rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <p style="font-weight:700; font-size:1.1rem; color:#211f1a; margin:0 0 1rem; letter-spacing:0.02em;">Kingdom Wash</p>
    <span class="badge">Limited time offer</span>
    <h1>10% off your first service</h1>
    <p>Sign up today and save on your very first booking with us.</p>
    <button>Claim your discount</button>
  </div>
</body>
</html>
